server:
  port: 8080

spring:
  application:
    name: rail-window-sim
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rail_window_sim}
    username: ${DB_USER:rail}
    password: ${DB_PASSWORD:rail}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 明确标识：本地模拟演练，无真实设备连接
rail-window:
  simulation-only: true

logging:
  level:
    com.railwindow: INFO

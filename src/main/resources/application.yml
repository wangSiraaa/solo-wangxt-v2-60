spring:
  application:
    name: block-window-permit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blockwindow_drill}
    username: ${DB_USERNAME:blockwindow}
    password: ${DB_PASSWORD:blockwindow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    local.train.blockwindow: INFO
